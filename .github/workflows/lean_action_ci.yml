name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
      - name: Offline release gate regressions
        shell: bash
        run: bash ci/test-require-main-ci.sh
      # linen's native build dependencies, from linen's own list at the
      # version liaison requires.
      - uses: typednotes/linen/.github/actions/setup-native-deps@v1.10.0
        with:
          keyring: false
      # `test: false`: the tests need a root key, so they run in the next step.
      - uses: leanprover/lean-action@v1
        with:
          test: false
      - run: LIAISON_ROOT_KEY=$(openssl rand -hex 32) lake test
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Native linked-device clients and encrypted storage regressions
        run: |
          sudo apt-get install -y libssl-dev protobuf-compiler
          LIAISON_TEST_TEMP="$RUNNER_TEMP" cargo test --locked --manifest-path native/paired/Cargo.toml
          cargo build --locked --manifest-path native/signal/Cargo.toml
          cargo build --locked --manifest-path native/whatsapp/Cargo.toml
          python3 native/check_libraries.py --temp-root "$RUNNER_TEMP" \
            --signal native/signal/target/debug/libliaison_signal.so \
            --whatsapp native/whatsapp/target/debug/libliaison_whatsapp.so

  native-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: liaison
      - uses: actions/checkout@v7
        with:
          repository: typednotes/linen
          ref: v1.10.0
          path: linen
      - uses: actions/checkout@v7
        with:
          repository: typednotes/lun
          ref: v0.3.0
          path: lun
      - uses: actions/checkout@v7
        with:
          repository: typednotes/lode
          ref: v0.3.0
          path: lode
      - uses: actions/checkout@v7
        with:
          repository: typednotes/typednotes
          ref: v0.6.0
          path: typednotes
      - uses: typednotes/linen/.github/actions/setup-native-deps@v1.10.0
        with:
          keyring: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: liaison
          test: false
      - name: Install disposable PostgreSQL fixture tools
        run: sudo apt-get install -y postgresql
      - name: Build the actual writer SDK fixture
        working-directory: liaison/LiaisonTest/integration/client
        run: lake build writerClient
      - name: Native operations, four ceilings, audit and catalog drift
        working-directory: liaison
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 build --locked --manifest-path native/fixture/Cargo.toml --target-dir native/fixture/target/signal
          cargo +1.97.1 build --locked --manifest-path native/fixture/Cargo.toml --features whatsapp --target-dir native/fixture/target/whatsapp
          python3 LiaisonTest/integration/connectors.py --temp-root "$RUNNER_TEMP" \
            --paired-signal-library native/fixture/target/signal/debug/libliaison_paired_fixture.so \
            --paired-whatsapp-library native/fixture/target/whatsapp/debug/libliaison_paired_fixture.so
