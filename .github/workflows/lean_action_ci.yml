name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # linen's native build dependencies, from linen's own list at the
      # version liaison requires.
      - uses: typednotes/linen/.github/actions/setup-native-deps@v1.9.1
        with:
          keyring: false
      # `test: false`: the tests need a root key, so they run in the next step.
      - uses: leanprover/lean-action@v1
        with:
          test: false
      - run: LIAISON_ROOT_KEY=$(openssl rand -hex 32) lake test
