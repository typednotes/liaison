[package]
name = "liaison-whatsapp"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
liaison-paired = { path = "../paired" }
anyhow = "1"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
whatsapp-rust = { version = "=0.7.0", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }

[workspace]
